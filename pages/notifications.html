
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notifications</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background: #f1f5f9;
        }

        .heading {
            text-align: center;
            padding: 30px;
        }

        .notification-container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        .notification-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
            border-left: 5px solid #2563eb;
        }

        .pending {
            color: #d97706;
        }

        .approved {
            color: green;
        }

        .rejected {
            color: red;
        }
    </style>
</head>

<body>

<header>
    <h2>Internship Portal</h2>
    <a href="student-dashboard.html">Dashboard</a>
</header>

<div class="heading">
    <h1>My Notifications</h1>
    <p>Check the latest updates about your applications.</p>
</div>

<div class="notification-container" id="notificationList"></div>

<script>

let student = JSON.parse(localStorage.getItem("loggedInStudent"));

if (!student) {
    alert("Please login first!");
    window.location.href = "student.html";
}

else {

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    let myApplications = applications.filter(function(app) {
        return app.email === student.email;
    });

    let output = document.getElementById("notificationList");

    if (myApplications.length === 0) {

        output.innerHTML = `
            <div class="notification-card">
                <h3>No Notifications Yet</h3>
                <p>You have not applied for any internships.</p>
            </div>
        `;

    } else {

        myApplications.forEach(function(app) {

            let statusClass = app.status.toLowerCase();

            let message = "";

            if (app.status === "Approved") {
                message = "Congratulations! Your application has been approved.";
            }
            else if (app.status === "Rejected") {
                message = "Your application was not selected.";
            }
            else {
                message = "Your application is waiting for admin review.";
            }

            output.innerHTML += `
                <div class="notification-card">
                    <h3>${app.internship}</h3>
                    <p>${message}</p>
                    <h3 class="${statusClass}">
                        Status: ${app.status}
                    </h3>
                </div>
            `;

        });

    }
}

</script>

</body>
</html>
