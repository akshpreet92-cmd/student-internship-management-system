
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background: #f1f5f9;
        }

        .heading {
            text-align: center;
            padding: 30px;
        }

        .application-container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .application-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
            border-left: 5px solid #2563eb;
        }

        .Pending {
            color: #d97706;
        }

        .Approved {
            color: green;
        }

        .Rejected {
            color: red;
        }

        .application-card p {
            margin: 10px 0;
        }
    </style>
</head>

<body>

<header>
    <h2>Internship Portal</h2>
    <a href="student-dashboard.html">Dashboard</a>
</header>

<div class="heading">
    <h1>My Applications</h1>
    <p>Track all your internship applications.</p>
</div>

<div class="application-container" id="applicationList"></div>

<script>

let student = JSON.parse(localStorage.getItem("loggedInStudent"));

if (!student) {
    alert("Please login first!");
    window.location.href = "student.html";
}
else {

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];

    let myApplications = applications.filter(function(app) {
        return app.email === student.email;
    });

    let output = document.getElementById("applicationList");

    if (myApplications.length === 0) {

        output.innerHTML = `
            <div class="application-card">
                <h2>No Applications Found</h2>
                <p>You have not applied for any internships yet.</p>
                <a href="internships.html">Explore Internships</a>
            </div>
        `;

    } else {

        myApplications.forEach(function(app) {

            output.innerHTML += `
                <div class="application-card">
                    <h2>${app.internship}</h2>
                    <p><b>Student Name:</b> ${app.name}</p>
                    <p><b>Email:</b> ${app.email}</p>
                    <p><b>Application Status:</b>
                        <strong class="${app.status}">
                            ${app.status}
                        </strong>
                    </p>
                </div>
            `;

        });

    }
}

</script>

</body>
</html>
