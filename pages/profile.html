
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        body {
            background: #f1f5f9;
        }

        .profile-container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .profile-container h1 {
            color: #14213d;
            margin-bottom: 25px;
        }

        .detail {
            padding: 15px;
            margin: 12px 0;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .detail strong {
            color: #2563eb;
        }
    </style>
</head>

<body>

<header>
    <h2>Student Portal</h2>
    <a href="student-dashboard.html">Dashboard</a>
</header>

<div class="profile-container">

    <h1>My Profile</h1>

    <div class="detail">
        <strong>Full Name:</strong>
        <span id="studentName"></span>
    </div>

    <div class="detail">
        <strong>Roll Number:</strong>
        <span id="studentRoll"></span>
    </div>

    <div class="detail">
        <strong>Email:</strong>
        <span id="studentEmail"></span>
    </div>

    <button onclick="goBack()">Back to Dashboard</button>

</div>

<script>

let student = JSON.parse(localStorage.getItem("loggedInStudent"));

if (!student) {
    window.location.href = "student.html";
} else {
    document.getElementById("studentName").innerText = student.name;
    document.getElementById("studentRoll").innerText = student.roll;
    document.getElementById("studentEmail").innerText = student.email;
}

function goBack() {
    window.location.href = "student-dashboard.html";
}

</script>

</body>
</html>
